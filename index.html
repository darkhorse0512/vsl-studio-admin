<!doctype html>
<html lang="en" class="dark" data-theme="teal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VSL Studio - Admin panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('vsl-studio.admin.theme');
        if (t) document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('vsl-studio.admin.surface');
        if (s && s !== 'midnight') document.documentElement.dataset.surface = s;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
